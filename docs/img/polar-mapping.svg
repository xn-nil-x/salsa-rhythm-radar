<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Сонограмма восьмёрки сворачивается в полярный циферблат: время становится углом, частота — радиусом">
  <rect x="0" y="0" width="900" height="440" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2230"/>
    </marker>
  </defs>

  <!-- Left: linear sonogram of one 8-count cycle -->
  <text x="190" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2230">Сонограмма одной восьмёрки</text>
  <rect x="30" y="60" width="320" height="235" fill="#f7f7f5" stroke="#9aa2b1"/>
  <g stroke="#c9ced8" stroke-width="1">
    <line x1="70" y1="60" x2="70" y2="295"/><line x1="110" y1="60" x2="110" y2="295"/>
    <line x1="150" y1="60" x2="150" y2="295"/><line x1="190" y1="60" x2="190" y2="295"/>
    <line x1="230" y1="60" x2="230" y2="295"/><line x1="270" y1="60" x2="270" y2="295"/>
    <line x1="310" y1="60" x2="310" y2="295"/>
  </g>
  <!-- sustained tones: horizontal lines -->
  <line x1="30" y1="255" x2="350" y2="255" stroke="#5DB39E" stroke-width="5" opacity="0.75"/>
  <line x1="30" y1="205" x2="350" y2="205" stroke="#A68AD6" stroke-width="3" opacity="0.75"/>
  <!-- clave 3-2 attacks: vertical streaks at 1, 2&, 4 | 6, 7 -->
  <g fill="#D9A04E" opacity="0.9">
    <rect x="31" y="64" width="6" height="228"/><rect x="89" y="64" width="6" height="228"/>
    <rect x="149" y="64" width="6" height="228"/><rect x="229" y="64" width="6" height="228"/>
    <rect x="269" y="64" width="6" height="228"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1b2230" text-anchor="middle">
    <text x="34" y="314">1</text><text x="70" y="314">2</text><text x="110" y="314">3</text><text x="150" y="314">4</text>
    <text x="190" y="314">5</text><text x="230" y="314">6</text><text x="270" y="314">7</text><text x="310" y="314">8</text>
  </g>
  <text x="190" y="340" text-anchor="middle" font-size="13" fill="#4b5363">время →</text>
  <line x1="18" y1="292" x2="18" y2="66" stroke="#1b2230" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="12" y="180" font-size="13" fill="#4b5363" transform="rotate(-90 12 180)" text-anchor="middle">частота</text>
  <text x="358" y="292" font-size="11" fill="#4b5363">0 Гц</text>
  <text x="358" y="70" font-size="11" fill="#4b5363">f max</text>

  <!-- Middle arrow -->
  <line x1="392" y1="185" x2="458" y2="185" stroke="#1b2230" stroke-width="2" marker-end="url(#arr)"/>
  <text x="425" y="165" text-anchor="middle" font-size="13" fill="#1b2230">сворачиваем</text>
  <text x="425" y="210" text-anchor="middle" font-size="13" fill="#1b2230">в круг</text>

  <!-- Right: polar dial -->
  <text x="650" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2230">Полярная спектрограмма</text>
  <circle cx="650" cy="205" r="150" fill="#f7f7f5" stroke="#9aa2b1"/>
  <g stroke="#c9ced8" stroke-width="1">
    <line x1="650" y1="160" x2="650" y2="55"/><line x1="681.8" y1="173.2" x2="756.1" y2="98.9"/>
    <line x1="695" y1="205" x2="800" y2="205"/><line x1="681.8" y1="236.8" x2="756.1" y2="311.1"/>
    <line x1="650" y1="250" x2="650" y2="355"/><line x1="618.2" y1="236.8" x2="543.9" y2="311.1"/>
    <line x1="605" y1="205" x2="500" y2="205"/><line x1="618.2" y1="173.2" x2="543.9" y2="98.9"/>
  </g>
  <circle cx="650" cy="205" r="80" fill="none" stroke="#5DB39E" stroke-width="5" opacity="0.75"/>
  <circle cx="650" cy="205" r="115" fill="none" stroke="#A68AD6" stroke-width="3" opacity="0.75"/>
  <g stroke="#D9A04E" stroke-width="7" opacity="0.9" stroke-linecap="butt">
    <line x1="650" y1="160" x2="650" y2="55"/>
    <line x1="691.6" y1="187.8" x2="788.6" y2="147.6"/>
    <line x1="681.8" y1="236.8" x2="756.1" y2="311.1"/>
    <line x1="618.2" y1="236.8" x2="543.9" y2="311.1"/>
    <line x1="605" y1="205" x2="500" y2="205"/>
  </g>
  <circle cx="650" cy="205" r="45" fill="#ffffff" stroke="#1b2230" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g font-size="14" font-weight="700" fill="#1b2230" text-anchor="middle" dominant-baseline="middle">
    <text x="650" y="40">1</text><text x="771.6" y="83.4">2</text><text x="820" y="205">3</text><text x="771.6" y="326.6">4</text>
    <text x="650" y="372">5</text><text x="528.4" y="326.6">6</text><text x="480" y="205">7</text><text x="528.4" y="83.4">8</text>
  </g>
  <!-- annotations -->
  <path d="M 700 40 A 165 165 0 0 1 790 92" fill="none" stroke="#1b2230" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="800" y="52" font-size="12" fill="#1b2230">угол = фаза,</text>
  <text x="800" y="67" font-size="12" fill="#1b2230">по часовой</text>
  <text x="650" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2230">r₀</text>
  <text x="650" y="216" text-anchor="middle" font-size="10" fill="#4b5363">f = 0</text>
  <text x="490" y="404" font-size="12" font-weight="700" fill="#1b2230">радиус = частота:</text>
  <text x="604" y="404" font-size="12" fill="#4b5363">лин. f = u·f max · лог. f = 40·(f max/40)^u</text>
  <text x="604" y="421" font-size="12" fill="#4b5363">где u = (r − r₀)/(R − r₀)</text>

  <g font-size="12" fill="#4b5363">
    <rect x="30" y="394" width="12" height="12" fill="#D9A04E"/><text x="48" y="404">атака (клаве) → луч</text>
    <rect x="30" y="413" width="12" height="12" fill="#5DB39E"/><text x="48" y="423">тон (бас) → окружность</text>
  </g>
</svg>
